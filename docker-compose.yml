version: '3.8'

services:
  auth-service:
    image: jorgegdoliveira8/auth-service
    build: .
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/auth_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=mycustomsecretchangeme
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-service-net

  auth-db:
    image: postgres:16
    container_name: auth-service-postgres
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-service-net
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  auth-service-net:
    driver: bridge

volumes:
  pgdata: