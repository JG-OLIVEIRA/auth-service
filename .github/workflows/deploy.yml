name: Pipeline CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-ecr:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRepoApp
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: auth-service
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        run: |
          REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_TAG=${ENVIRONMENT}-${COMMIT_SHA}

          IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG

          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-ssh:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-ecr

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRepoApp
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPOSITORY: auth-service

          IMAGE_TAG: ${{ needs.build-ecr.outputs.image_tag }}

          INSTANCE_KEY: ${{ secrets.INSTANCE_KEY }}
          ELASTIC_IP: ${{ secrets.ELASTIC_IP }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}

        run: |
          REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
          IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG

          echo "$INSTANCE_KEY" > terraform-keypair.pem
          chmod 400 terraform-keypair.pem

          ssh -i terraform-keypair.pem -o StrictHostKeyChecking=no ec2-user@$ELASTIC_IP << EOF

            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $REGISTRY

            docker pull $IMAGE_URI

            docker stop auth-service || true
            docker rm auth-service || true

            docker run -d \
              --name auth-service \
              -p 80:8081 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e DATABASE_USERNAME="$DATABASE_USERNAME" \
              -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
              -e RABBITMQ_URL="$RABBITMQ_URL" \
              $IMAGE_URI

            docker ps

          EOF

          rm terraform-keypair.pem